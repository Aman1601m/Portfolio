<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Sleek dark background -->
  <rect width="64" height="64" rx="18" fill="#18181b" />
  <rect width="60" height="60" x="2" y="2" rx="16" fill="none" stroke="#27272a" stroke-width="2" />
  
  <!-- Glowing developer logo -->
  <g transform="translate(10, 10)">
    <!-- Chevron left: < -->
    <path d="M 12 10 L 2 22 L 12 34" fill="none" stroke="url(#orangeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chevron right: > -->
    <path d="M 32 10 L 42 22 L 32 34" fill="none" stroke="url(#orangeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center slash: / -->
    <path d="M 26 7 L 18 37" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>